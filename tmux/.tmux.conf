if-shell '[ ! -x /Users/t06/.homebrew/bin/zsh ] && [ -x /opt/homebrew/bin/zsh ]' 'set-option -g default-shell /opt/homebrew/bin/zsh'
if-shell '[ ! -x /Users/t06/.homebrew/bin/zsh ] && [ ! -x /opt/homebrew/bin/zsh ] && [ -x /usr/local/bin/zsh ]' 'set-option -g default-shell /usr/local/bin/zsh'
if-shell '[ ! -x /Users/t06/.homebrew/bin/zsh ] && [ ! -x /opt/homebrew/bin/zsh ] && [ ! -x /usr/local/bin/zsh ] && [ -x /bin/zsh ]' 'set-option -g default-shell /bin/zsh'
if-shell '[ ! -x /Users/t06/.homebrew/bin/zsh ] && [ ! -x /opt/homebrew/bin/zsh ] && [ ! -x /usr/local/bin/zsh ] && [ ! -x /bin/zsh ] && [ -x /opt/homebrew/bin/bash ]' 'set-option -g default-shell /opt/homebrew/bin/bash'
if-shell '[ ! -x /Users/t06/.homebrew/bin/zsh ] && [ ! -x /opt/homebrew/bin/zsh ] && [ ! -x /usr/local/bin/zsh ] && [ ! -x /bin/zsh ] && [ ! -x /opt/homebrew/bin/bash ] && [ -x /usr/local/bin/bash ]' 'set-option -g default-shell /usr/local/bin/bash'
if-shell '[ ! -x /Users/t06/.homebrew/bin/zsh ] && [ ! -x /opt/homebrew/bin/zsh ] && [ ! -x /usr/local/bin/zsh ] && [ ! -x /bin/zsh ] && [ ! -x /opt/homebrew/bin/bash ] && [ ! -x /usr/local/bin/bash ]' 'set-option -g default-shell /bin/bash'
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set -s copy-command 'xclip -in -selection clipboard'
if-shell 'command -v wl-copy >/dev/null 2>&1' 'set -s copy-command "wl-copy"'
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command "pbcopy"'

set -s escape-time 0

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g focus-events on
set -g status-style 'fg=#FFF4E5'
bind x source-file ~/.tmux.conf

set -g base-index 1
set-window-option -g mode-keys vi

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

unbind -n WheelUpPane
unbind -n WheelDownPane
bind -n WheelUpPane if-shell -F -t = "#{alternate_on}" \
  "send-keys -M" \
  "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{alternate_on}" \
  "send-keys -M" \
  "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"


set -g display-panes-time 800
set -g display-time 1000


if-shell '[ -f ~/.tmux-local/theme.conf ]' 'source-file ~/.tmux-local/theme.conf'
set-option -g status-interval 10
set-option -g status-right "#[fg=#a3be8c] %Y-%m-%d #[fg=#81a1c1]%H:%M "
